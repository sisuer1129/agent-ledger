<!doctype html>

<head>

  <title>我的私人账本</title>
  <link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/styles.css?v=20260920-person-tags2">
</head>
<body>
  <div id="status" role="status" aria-live="polite"></div>
  <main id="desktopWorkspace">
    <nav class="glass topnav" aria-label="主导航">
      <strong>日用账本</strong>
      <div class="navlinks">
        <button class="is-active" data-page="overview" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></svg><span>概览</span></button>
        <button data-page="ledger"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg><span>明细</span></button>
        <button data-page="budget"><svg viewBox="0 0 24 24"><path d="M4 19V5m5 14v-8m5 8V7m5 12V3"/></svg><span>预算</span></button>
        <button data-page="taxonomy"><svg viewBox="0 0 24 24"><path d="M4 7h10l6 5-6 5H4zM8 12h.01"/></svg><span>分类与标签</span></button>
        <button data-page="settings"><svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.12 2.12-.06-.06A1.7 1.7 0 0 0 15.74 18a1.7 1.7 0 0 0-1.02 1.55V20h-3v-.45A1.7 1.7 0 0 0 10.7 18a1.7 1.7 0 0 0-1.88.34l-.06.06-2.12-2.12.06-.06A1.7 1.7 0 0 0 7.04 14.3 1.7 1.7 0 0 0 5.5 13.28H5v-3h.5a1.7 1.7 0 0 0 1.54-1.02 1.7 1.7 0 0 0-.34-1.88l-.06-.06L8.76 5.2l.06.06A1.7 1.7 0 0 0 10.7 5a1.7 1.7 0 0 0 1.02-1.55V3h3v.45A1.7 1.7 0 0 0 15.74 5a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.12 2.12-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.54 1.02h.5v3h-.5A1.7 1.7 0 0 0 19.4 15Z"/></svg><span>设置</span></button>
      </div>
      <button class="primary" data-open="transactionDialog"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>记一笔</span></button>
    </nav>
    <section id="overviewPage" class="page active"><section class="overview-top-cards"><section class="overview-summary-card" aria-label="本月概览"><p class="eyebrow">本月概览</p><p class="overview-summary-label">本月结余</p><strong id="overviewBalance">¥0.00</strong><div class="overview-summary-metrics"><span><small>收入</small><strong id="overviewIncome">¥0.00</strong></span><span><small>支出</small><strong id="overviewExpense">¥0.00</strong></span></div></section><button id="overviewBudgetCard" class="overview-budget-card" data-page="budget" type="button"></button></section><div class="workspace"><section class="account-panel" aria-label="账户列表"><header class="account-panel-head"><div><p class="eyebrow">账户列表</p><h2>账户</h2></div><button class="account-add-button" data-open="accountDialog" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>添加账户</button></header><div id="accountList" class="account-list"></div></section><section id="accountDetail" class="detail-panel" aria-live="polite"><div class="panel-state"><strong>选择一个账户</strong><p>查看交易明细与账期信息。</p></div></section></div></section>
    <section id="ledgerPage" class="page"><div class="page-head ledger-page-head"><h1>收支明细</h1><a id="exportLink" class="export-button" href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 17v3h14v-3"/></svg>导出 CSV</a></div><form id="filterForm" class="filters"><div class="filter-main"><input name="query" placeholder="搜索备注"><input name="start" type="date" aria-label="开始日期"><input name="end" type="date" aria-label="结束日期"><select name="account_id"><option value="">全部账户</option></select><select name="category_id"><option value="">全部分类</option></select><select name="transaction_kind"><option value="">全部性质</option><option value="expense">支出</option><option value="income">收入</option><option value="refund">退款</option><option value="transfer">转账</option><option value="credit_repayment">信用卡还款</option></select><div class="filter-actions"><button class="filter-submit">筛选</button><button id="resetFilters" class="filter-reset" type="button">重置</button></div></div><details class="filter-more"><summary>更多筛选 <span>标签与金额</span></summary><div class="filter-more-fields"><select name="tag_id"><option value="">全部标签</option></select><input name="min_amount" type="number" step="0.01" aria-describedby="amountFilterHint" placeholder="最小金额"><input name="max_amount" type="number" step="0.01" aria-describedby="amountFilterHint" placeholder="最大金额"><p id="amountFilterHint" class="filter-amount-hint">支出请填负数，例如 -30.50</p></div></details></form><div id="ledgerRows" class="unified-list"></div></section>
    <section id="budgetPage" class="page"><div class="page-head"><h1>预算</h1><button data-open="budgetDialog">设置预算</button></div><section id="budgetSummary" class="budget-summary" aria-live="polite"></section><div id="budgetRows" class="unified-list"></div></section>
    <section id="taxonomyPage" class="page"><div class="page-head"><h1>分类与标签</h1><input id="taxonomyMonth" type="month" aria-label="统计月份"></div><div id="taxonomyRows"></div><section class="tag-stats-section" aria-labelledby="tagStatsTitle"><div><h2 id="tagStatsTitle">标签统计</h2><p>仅统计支出；多标签交易会分别计入各标签。</p></div><div id="tagStatsRows" class="unified-list"></div></section><div class="page-head"><h2>关键词规则</h2><button data-open="ruleDialog">新增规则</button></div><div id="ruleRows" class="unified-list"></div></section>
    <section id="settingsPage" class="page"><h1>设置</h1><label>API 地址<input id="apiUrl" placeholder="留空即当前地址"></label><label>API Key<input id="apiKey" type="password"></label><button id="saveSettings">保存连接设置</button></section>
  </main>
  <main id="mobileApp"><header class="mobile-head"><strong>日用账本</strong><span id="mobileSummary">¥0.00</span></header><section id="mobileContent" aria-live="polite"></section><button class="fab" data-open="transactionDialog" aria-label="记一笔"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><nav class="bottomnav" aria-label="移动导航"><button class="is-active" data-mobile-tab="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3zM9 20v-6h6v6"/></svg><span>首页</span></button><button data-mobile-tab="ledger"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg><span>明细</span></button><button data-mobile-tab="stats"><svg viewBox="0 0 24 24"><path d="M4 19V5m5 14v-8m5 8V7m5 12V3"/></svg><span>统计</span></button><button data-mobile-tab="settings"><svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7"/><path d="M19 12h2M3 12h2M12 3v2M12 19v2"/></svg><span>设置</span></button></nav></main>
  <dialog id="transactionDialog" aria-labelledby="transactionDialogTitle"><form id="transactionForm"><header><h2 id="transactionDialogTitle">记一笔</h2><button type="button" data-close aria-label="关闭"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header><p id="transactionFormError" class="form-error" data-form-error role="status" aria-atomic="true" tabindex="-1" hidden></p><label>日期<input name="timestamp" type="date" required></label><label>金额<input name="amount" type="number" step="0.01" min="0.01" required></label><fieldset class="transaction-mode"><legend>性质</legend><label><input name="transaction_mode" type="radio" value="expense" checked><span>支出</span></label><label><input name="transaction_mode" type="radio" value="income"><span>收入</span></label><label><input name="transaction_mode" type="radio" value="refund"><span>退款</span></label><label><input name="transaction_mode" type="radio" value="transfer"><span>转账</span></label><label><input name="transaction_mode" type="radio" value="topup_withdrawal"><span>充值/提现</span></label><label><input name="transaction_mode" type="radio" value="balance_adjustment"><span>余额调整</span></label><label><input name="transaction_mode" type="radio" value="credit_repayment"><span>信用卡还款</span></label></fieldset><input name="transaction_kind" type="hidden" value="expense"><label data-transaction-field="account"><span class="transaction-account-label">账户</span><select name="account_id" required></select></label><label data-transaction-field="repayment-credit" hidden>还款至<select name="repayment_credit_account_id"></select></label><label data-transaction-field="ordinary">分类<select name="category_id" class="category-native"></select><button id="categoryPickerToggle" class="category-picker-toggle" type="button" aria-expanded="false">自动建议</button><section id="categoryPicker" class="category-picker" hidden><input id="categoryPickerSearch" type="search" placeholder="搜索分类，例如“停车”"><p class="picker-label">常用</p><div id="categoryQuickChoices" class="category-chips"></div><p class="picker-label">全部分类</p><div id="categoryPickerGroups" class="category-groups"></div></section></label><p id="transactionBudgetImpact" class="transaction-budget-impact" data-transaction-field="ordinary" aria-live="polite" hidden></p><label data-transaction-field="ordinary">消费人员<select name="tag_ids" multiple></select><span class="field-hint">可多选；旧标签仅在编辑历史交易时保留。</span></label><p class="repayment-note" data-transaction-field="repayment-note" hidden>将自动生成两笔还款记录，不计入消费和预算统计。</p><label>备注<input name="description" required></label><div class="dialog-actions"><button class="danger" id="deleteTransaction" type="button" hidden>删除这笔交易</button><button class="primary" type="submit"><span data-save-label>保存</span></button></div></form></dialog>
  <dialog id="accountDialog" aria-labelledby="accountDialogTitle"><form id="accountForm"><header><h2 id="accountDialogTitle">账户设置</h2><button type="button" data-close aria-label="关闭"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header><p id="accountFormError" class="form-error" data-form-error role="status" aria-atomic="true" tabindex="-1" hidden></p><input name="id" type="hidden"><label>名称<input name="name" required></label><label>账户类型<select name="type"><option value="debit">储蓄卡</option><option value="credit">信用卡</option><option value="cash">现金</option><option value="stored_value">储值账户</option><option value="wechat">微信账户</option><option value="shopping_card">购物卡</option></select></label><label data-account-create-field hidden>初始余额<input name="initial_balance" type="number" step="0.01" value="0"><span class="field-hint">信用卡已有欠款时请填负数</span></label><label>月度预算<input name="monthly_budget" type="number" min="0" step="0.01"></label><label>预算周期<select name="budget_period"><option value="calendar_month">自然月</option><option value="billing_cycle">账单周期</option></select></label><label>授信额度<input name="credit_limit" type="number" min="0" step="0.01"></label><label>账单日<input name="statement_day" type="number" min="1" max="28"></label><label>还款日<input name="due_day" type="number" min="1" max="28"></label><label>还款月份<select name="due_month_offset"><option value="1">下月</option><option value="0">当月</option></select></label><div class="dialog-actions"><button class="danger" type="button" id="deactivateAccount">停用账户</button><button class="primary" type="submit"><span data-account-save-label>保存</span></button></div></form></dialog>
  <dialog id="budgetDialog" aria-labelledby="budgetDialogTitle"><form id="budgetForm"><header><h2 id="budgetDialogTitle">设置预算</h2><button type="button" data-close aria-label="关闭"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header><p id="budgetFormError" class="form-error" data-form-error role="status" aria-atomic="true" tabindex="-1" hidden></p><label>范围<select name="scope_type"><option value="total">本月总预算</option><option value="category">一级分类</option><option value="account">账户（兼容旧设置）</option></select></label><label data-budget-object>对象<select name="scope_id"></select></label><label>金额<input name="amount" type="number" min="0" step="0.01" required></label><label>生效月份<input name="effective_from" type="month" required></label><button class="primary" type="submit">保存</button></form></dialog>
  <dialog id="ruleDialog" aria-labelledby="ruleDialogTitle"><form id="ruleForm"><header><h2 id="ruleDialogTitle">新增规则</h2><button type="button" data-close aria-label="关闭"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header><p id="ruleFormError" class="form-error" data-form-error role="status" aria-atomic="true" tabindex="-1" hidden></p><label>规则类型<select name="rule_type"><option value="category">分类</option><option value="tag">标签</option><option value="kind">性质</option></select></label><label>关键词<input name="pattern" required></label><label data-rule-target="category">分类<select name="category_id"></select></label><label data-rule-target="tag">标签<select name="tag_id"></select></label><label data-rule-target="kind">性质<select name="transaction_kind"><option value="expense">支出</option><option value="income">收入</option><option value="transfer">转账</option><option value="credit_repayment">信用卡还款</option><option value="topup_withdrawal">充值/提现</option><option value="balance_adjustment">平账</option></select></label><label>优先级<input name="priority" type="number" value="100"></label><button class="primary" type="submit">保存</button></form></dialog>
  <script type="module" src="/app.mjs?v=20260920-person-tags2"></script>
</body></html>
